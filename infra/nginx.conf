events {}

http {
    # No load-balancing directive -> nginx's default is round-robin, which
    # is exactly what this phase needs to prove. Deliberately not ip_hash:
    # that would pin every client to one backend and defeat the point.
    upstream rate_limiter_app {
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiter_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
