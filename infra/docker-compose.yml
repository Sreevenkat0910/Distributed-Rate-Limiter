# Three named app services (app1/app2/app3) rather than a single service
# with `deploy.replicas: 3`: with replicas, all containers share one
# Compose-internal DNS name, and nginx's open-source upstream block
# resolves hostnames once at startup with no re-resolution -- it can't
# reliably enumerate multiple containers behind a single name for
# round-robin. Three distinct services give nginx a fixed, explicit list
# of three backends, and let each container get its own REPLICA_ID
# trivially via its own `environment:` block.
services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Sits only between the app replicas and Redis -- nginx and client
  # traffic never touch it. The apps' REDIS_URL points here instead of
  # directly at redis:6379, so a latency/fault toxic added via the admin
  # API (published to the host on 8474) affects real app-to-Redis calls
  # without any app code changes.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474"
    depends_on:
      redis:
        condition: service_healthy
    # No HEALTHCHECK here: the image is a scratch-style build with only
    # the /toxiproxy binary -- no shell, no curl/wget/nc, nothing to
    # build a CMD-based check out of. It's a lightweight Go binary that
    # starts near-instantly, and anything that needs it ready (the load
    # test's fault-injection controller) polls its admin API itself
    # before proceeding, which gives the same real-readiness guarantee.

  app1:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      REDIS_URL: redis://toxiproxy:26379/0
      REPLICA_ID: app1
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      BREAKER_RESET_TIMEOUT_SECONDS: ${BREAKER_RESET_TIMEOUT_SECONDS:-30}
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  app2:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      REDIS_URL: redis://toxiproxy:26379/0
      REPLICA_ID: app2
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      BREAKER_RESET_TIMEOUT_SECONDS: ${BREAKER_RESET_TIMEOUT_SECONDS:-30}
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  app3:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      REDIS_URL: redis://toxiproxy:26379/0
      REPLICA_ID: app3
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      BREAKER_RESET_TIMEOUT_SECONDS: ${BREAKER_RESET_TIMEOUT_SECONDS:-30}
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
