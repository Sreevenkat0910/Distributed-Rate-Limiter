[project]
name = "distributed-rate-limiter"
version = "0.1.0"
description = "A distributed rate limiter enforcing a shared limit across instances, backed by Redis."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "redis>=5.1",
    "pybreaker>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
loadtest = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
